name: Deploy sito Quartz su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sito-quartz/**'
      - 'Anno 1/**'
      - 'Anno 2/**'
      - 'Anno 3/**'
      - '.github/workflows/deploy-quartz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Sincronizza gli appunti in content/
        run: bash sito-quartz/scripts/sync-content.sh

      - name: Installa le dipendenze
        working-directory: sito-quartz
        run: npm ci

      - name: Installa i plugin di Quartz
        working-directory: sito-quartz
        run: npx quartz plugin install --from-config

      - name: Build del sito
        working-directory: sito-quartz
        run: npx quartz build

      - name: Upload artifact per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito-quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
